<title>Estúdio Expansion</title>
<style>
/*__FACES__*/

/* Chrome escuro de ferramenta, de propósito: o canvas é do cliente,
   a interface sai da frente. Tema único, tudo pintado explicitamente. */
:root{
  --app:#141418; --painel:#1C1C22; --campo:#24242C; --linha:#2E2E38;
  --linha-forte:#3D3D4A; --texto:#E9E9EF; --meio:#9A9AA8; --fraco:#6C6C7A;
  --expansion:#E67E22; --ok:#3FB88F;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--app);color:var(--texto);font-family:var(--ui);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- topo ---------- */
.topo{border-bottom:1px solid var(--linha);background:var(--painel);position:sticky;top:0;z-index:50}
.topo-linha{display:flex;align-items:center;gap:24px;padding:0 20px;min-height:56px;flex-wrap:wrap}
.marca-app{display:flex;align-items:baseline;gap:9px;padding:10px 0}
.marca-app strong{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:650}
.marca-app span{font-family:var(--mono);font-size:10px;color:var(--fraco);letter-spacing:.1em}
.abas{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;padding-bottom:0}
.aba{appearance:none;border:0;background:transparent;color:var(--meio);font-family:var(--ui);
  font-size:13px;font-weight:500;padding:17px 15px 15px;border-bottom:2px solid transparent;
  cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:color .12s}
.aba:hover{color:var(--texto)}
.aba[aria-selected="true"]{color:var(--texto);border-bottom-color:var(--pt-accent,var(--expansion))}
.aba .ponto{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.18)}
.aba:focus-visible{outline:2px solid var(--expansion);outline-offset:-2px}

/* ---------- grade ---------- */
.grade{display:grid;grid-template-columns:264px minmax(0,1fr) 340px;gap:0;
  height:calc(100vh - 57px);min-height:600px}
.col{overflow-y:auto;padding:20px}
.col-esq{border-right:1px solid var(--linha);background:var(--painel)}
.col-dir{border-left:1px solid var(--linha);background:var(--painel)}
.col-meio{background:var(--app);display:flex;flex-direction:column;gap:16px;padding:20px}

.bloco{margin-bottom:26px}
.rotulo{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--fraco);margin-bottom:11px;display:block}

/* ---------- marca ---------- */
.cores{display:flex;flex-direction:column;gap:9px}
.cor{display:flex;align-items:center;gap:11px;background:var(--campo);border:1px solid var(--linha);
  border-radius:7px;padding:8px 10px}
.cor input[type=color]{appearance:none;border:0;width:30px;height:30px;border-radius:6px;
  background:transparent;cursor:pointer;padding:0;flex:none}
.cor input[type=color]::-webkit-color-swatch{border:1px solid rgba(255,255,255,.22);border-radius:6px}
.cor input[type=color]::-moz-color-swatch{border:1px solid rgba(255,255,255,.22);border-radius:6px}
.cor-txt{flex:1;min-width:0}
.cor-nome{font-size:12px;font-weight:500}
.cor-hex{font-family:var(--mono);font-size:11px;color:var(--meio)}

.campo{background:var(--campo);border:1px solid var(--linha);border-radius:7px;
  padding:8px 10px;color:var(--texto);font-family:var(--ui);font-size:13px;width:100%}
.campo:focus{outline:0;border-color:var(--linha-forte)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{font-family:var(--mono);font-size:10px;color:var(--fraco);margin-top:6px;display:block}

/* ---------- templates ---------- */
.tpls{display:flex;flex-direction:column;gap:7px}
.tpl{display:flex;gap:11px;align-items:center;background:var(--campo);border:1px solid var(--linha);
  border-radius:8px;padding:9px;cursor:pointer;text-align:left;color:inherit;font-family:inherit;width:100%}
.tpl:hover{border-color:var(--linha-forte)}
.tpl[aria-pressed="true"]{border-color:var(--pt-accent,var(--expansion));
  background:color-mix(in srgb,var(--pt-accent,var(--expansion)) 11%,var(--campo))}
.tpl:focus-visible{outline:2px solid var(--expansion);outline-offset:1px}
.tpl-mini{width:34px;height:43px;border-radius:3px;flex:none;overflow:hidden;position:relative;
  border:1px solid rgba(255,255,255,.10)}
.tpl-nome{display:block;font-size:12px;font-weight:550;line-height:1.25}
.tpl-sub{display:block;font-family:var(--mono);font-size:9.5px;color:var(--fraco);letter-spacing:.05em;margin-top:2px}

/* ---------- canvas ---------- */
.canvas-topo{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.canvas-info{font-family:var(--mono);font-size:11px;color:var(--fraco);letter-spacing:.06em}
.canvas-info b{color:var(--meio);font-weight:500}
.palco{flex:1;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  background:
    linear-gradient(45deg,#1A1A20 25%,transparent 25%,transparent 75%,#1A1A20 75%),
    linear-gradient(45deg,#1A1A20 25%,#191920 25%,#191920 75%,#1A1A20 75%);
  background-size:22px 22px;background-position:0 0,11px 11px;
  border:1px solid var(--linha);border-radius:12px;padding:22px}
.moldura{box-shadow:0 12px 40px rgba(0,0,0,.5);border-radius:3px;overflow:hidden;flex:none}

.tiras{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 6px}
.tira{flex:none;border:2px solid transparent;border-radius:5px;overflow:hidden;cursor:pointer;
  background:transparent;padding:0;position:relative;line-height:0}
.tira[aria-pressed="true"]{border-color:var(--pt-accent,var(--expansion))}
.tira:focus-visible{outline:2px solid var(--expansion);outline-offset:1px}
.tira-n{position:absolute;left:3px;top:2px;font-family:var(--mono);font-size:8px;
  color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.9);z-index:5;line-height:1}

/* o slide real: 1080x1350, escalado por transform */
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;transform-origin:top left;
  font-family:'Poppins',var(--ui)}

/* ---------- conteúdo ---------- */
textarea.editor{background:var(--campo);border:1px solid var(--linha);border-radius:8px;
  padding:12px;color:var(--texto);font-family:var(--mono);font-size:11.5px;line-height:1.7;
  width:100%;min-height:340px;resize:vertical}
textarea.editor:focus{outline:0;border-color:var(--linha-forte)}
.acoes{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--linha-forte);background:var(--campo);color:var(--texto);
  font-family:var(--ui);font-size:12.5px;font-weight:550;padding:9px 15px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--meio)}
.btn:focus-visible{outline:2px solid var(--expansion);outline-offset:1px}
.btn-forte{background:var(--pt-accent,var(--expansion));border-color:transparent;color:#fff}
.btn-forte:hover{filter:brightness(1.08)}

.aviso{border-left:2px solid var(--expansion);background:rgba(230,126,34,.08);
  padding:10px 13px;border-radius:0 6px 6px 0;font-size:12px;color:var(--meio);margin-top:13px}
.aviso b{color:var(--texto);font-weight:600}
.contagem{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.linha-c{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);
  font-size:10.5px;color:var(--fraco);gap:10px}
.linha-c .val{color:var(--meio)}
.linha-c .val.alerta{color:var(--expansion)}
.linha-c .val.bom{color:var(--ok)}

@media(max-width:1180px){
  .grade{grid-template-columns:1fr;height:auto}
  .col{max-height:none;border:0;border-bottom:1px solid var(--linha)}
  .palco{min-height:520px}
}
</style>

<div class="topo">
  <div class="topo-linha">
    <div class="marca-app"><strong>Estúdio</strong><span>EXPANSION · v0</span></div>
    <div class="abas" role="tablist" id="abas"></div>
  </div>
</div>

<div class="grade">
  <aside class="col col-esq">
    <div class="bloco">
      <span class="rotulo">Marca do cliente</span>
      <div class="cores" id="cores"></div>
      <span class="mini" id="fontes-info"></span>
    </div>

    <div class="bloco">
      <span class="rotulo">Assinatura</span>
      <input class="campo" id="handle" aria-label="@ do Instagram">
      <div class="dupla" style="margin-top:8px">
        <input class="campo" id="nome" aria-label="Nome da marca">
        <input class="campo" id="direito" aria-label="Assinatura de rodapé">
      </div>
    </div>

    <div class="bloco">
      <span class="rotulo">Template</span>
      <div class="tpls" id="tpls"></div>
    </div>
  </aside>

  <main class="col-meio">
    <div class="canvas-topo">
      <div class="canvas-info">
        <b id="info-tpl">—</b> · <span id="info-n">—</span> · 1080 × 1350
      </div>
      <div class="acoes" style="margin:0">
        <button class="btn" id="btn-prev" type="button">‹</button>
        <button class="btn" id="btn-next" type="button">›</button>
      </div>
    </div>
    <div class="palco"><div class="moldura" id="moldura"></div></div>
    <div class="tiras" id="tiras"></div>
  </main>

  <aside class="col col-dir">
    <div class="bloco">
      <span class="rotulo">Conteúdo</span>
      <textarea class="editor" id="editor" spellcheck="false" aria-label="Blocos de texto"></textarea>
      <div class="acoes">
        <button class="btn btn-forte" id="btn-aplicar" type="button">Aplicar</button>
        <button class="btn" id="btn-exemplo" type="button">Exemplo</button>
      </div>
      <div class="aviso">
        Um bloco por linha, no formato <b>texto N -</b>. Ímpar vira headline, par vira apoio.
        Dois blocos por slide.
      </div>
      <div class="contagem" id="contagem"></div>
    </div>
  </aside>
</div>

<script>
/* ============ dados ============ */
const CLIENTES = [
  { id:'prime', nome:'Prime Alphaville', handle:'@prime.alphaville', marca:'Prime Assessoria',
    direito:'2026 ®', nicho:'Crédito imobiliário',
    escuro:'#191818', accent:'#E14414', claro:'#F0EEEC',
    head:'Montserrat', body:'Poppins' },
  { id:'albanos', nome:'Clínica Albanos', handle:'@clinicaalbanos', marca:'Clínica Albanos',
    direito:'2026 ®', nicho:'Autismo',
    escuro:'#12212E', accent:'#2E9BC4', claro:'#EEF4F7',
    head:'Montserrat', body:'Poppins' },
  { id:'cies', nome:'Ciés Brand', handle:'@ciesbrand', marca:'Ciés',
    direito:'2026 ®', nicho:'Moda feminina',
    escuro:'#1E1519', accent:'#C4728A', claro:'#F6F0F1',
    head:'Montserrat', body:'Poppins' },
  { id:'clau', nome:'Clau Kids', handle:'@claukids', marca:'Clau Kids',
    direito:'2026 ®', nicho:'Moda infantil',
    escuro:'#1B2233', accent:'#F2A93B', claro:'#FDF6EA',
    head:'Montserrat', body:'Poppins' },
  { id:'fred', nome:'Dr. Fred', handle:'@drfredoficial', marca:'Dr. Fred',
    direito:'2026 ®', nicho:'Saúde',
    escuro:'#101C1A', accent:'#1E9E7E', claro:'#EEF6F3',
    head:'Montserrat', body:'Poppins' },
];

/* Cinco templates. Os quatro de topo são modelados nos da BrandsDecoded;
   o de meio é o que já roda no renderizador da skill. */
const TEMPLATES = [
  { id:'meio',   nome:'Meio de Funil',  etapa:'MEIO · 9 SLIDES',
    ritmo:['capa','claro','destaque','escuro','destaque','escuro','destaque','escuro','cta'] },
  { id:'brands1',nome:'Brands 1',       etapa:'TOPO · FOTO + BASE',  ritmo:null, n:7 },
  { id:'brands2',nome:'Brands 2',       etapa:'TOPO · SERIFA CENTRO',ritmo:null, n:7 },
  { id:'brands3',nome:'Brands 3',       etapa:'TOPO · DUAS COLUNAS', ritmo:null, n:7 },
  { id:'twitter',nome:'Twitter',        etapa:'TOPO · CARTÃO',       ritmo:null, n:7 },
];

const EXEMPLO = `texto 1 - O banco nega e a venda para
texto 2 - O que muda quando o crédito do cliente é bem estruturado
texto 3 - Ninguém comprou
texto 4 - As indicações saíram de pesquisa com o próprio mercado: corretores, imobiliárias e profissionais do setor.
texto 5 - O crédito define o teto
texto 6 - Antes da visita, já dá pra saber o que o cliente aguenta pagar de parcela.
texto 7 - Score não é sentença
texto 8 - O que um banco recusa por score, outro aprova por patrimônio.
texto 9 - A conta muda
texto 10 - Cliente bem estruturado compra imóvel melhor, e imóvel melhor é comissão maior.
texto 11 - O cliente continua
texto 12 - Negado no banco, ele ainda tem caminho, e segue com o corretor que o levou até ali.
texto 13 - Análise integrada
texto 14 - Banco isolado limita o poder de compra. Olhar várias políticas ao mesmo tempo amplia.
texto 15 - Quem indica assina
texto 16 - Indicar uma assessoria é colocar o próprio nome junto do serviço dela.
texto 17 - Chama no direct
texto 18 - Quer a análise de crédito dos seus clientes? Manda mensagem.`;

/* ============ estado ============ */
let cli = CLIENTES[0];
let tpl = TEMPLATES[0];
let blocos = [];
let atual = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function parse(txt){
  const out = [];
  txt.split('\n').forEach(l => {
    const m = l.match(/^\s*texto\s+(\d+)\s*-\s*(.*)$/i);
    if (m) out[+m[1]-1] = m[2].trim();
  });
  for (let i=0;i<out.length;i++) if (out[i]===undefined) out[i]='';
  return out;
}
const nSlides = () => tpl.ritmo ? tpl.ritmo.length : (tpl.n || 7);
const par = i => ({ h: blocos[i*2] || '', c: blocos[i*2+1] || '' });

/* foto de exemplo — no sistema real entra a imagem do cliente */
function foto(seed){
  return `linear-gradient(${140+seed*24}deg, ${cli.escuro} 0%, ${cli.accent} 62%, ${cli.claro} 140%)`;
}

/* ============ render dos templates ============ */
function barra(cor){
  return `<div style="position:absolute;top:0;left:0;right:0;padding:44px 60px 0;display:flex;
    justify-content:space-between;z-index:20;font-size:19px;font-weight:500;letter-spacing:.4px;
    color:${cor}">
    <span>${esc(cli.handle)}</span><span>${esc(cli.marca)}</span><span>${esc(cli.direito)}</span></div>`;
}
function chip(){
  return `<div style="display:inline-flex;align-items:center;gap:13px;background:rgba(0,0,0,.45);
    border:1.5px solid rgba(255,255,255,.16);border-radius:60px;padding:11px 26px 11px 12px">
    <span style="width:40px;height:40px;border-radius:50%;background:${cli.accent};display:flex;
    align-items:center;justify-content:center;font-family:'Montserrat';font-size:20px;font-weight:800;
    color:#fff">${esc(cli.marca[0])}</span>
    <span style="font-size:23px;font-weight:500;color:#fff">${esc(cli.handle)}</span>
    <span style="width:24px;height:24px;border-radius:50%;background:#1d9bf0;color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:14px;font-weight:700">✓</span></div>`;
}
const H = (t,sz,cor,extra='') => `<div style="font-family:'Montserrat';font-size:${sz}px;font-weight:800;
  line-height:.92;letter-spacing:-.04em;text-transform:uppercase;color:${cor};${extra}">${esc(t)}</div>`;

function render(i){
  const {h,c} = par(i);
  const T = tpl.id;

  if (T === 'meio'){
    const f = tpl.ritmo[i];
    if (f === 'capa') return `<div class="slide" style="background:${cli.escuro}">
      <div style="position:absolute;inset:0;background:${foto(0)};opacity:.85"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(to bottom,
        rgba(0,0,0,.30) 0%,rgba(0,0,0,.10) 26%,rgba(0,0,0,.66) 58%,rgba(0,0,0,.95) 82%,#000 100%)"></div>
      ${barra('rgba(255,255,255,.55)')}
      <div style="position:absolute;left:60px;right:60px;bottom:120px;z-index:10;display:flex;
        flex-direction:column;align-items:center;text-align:center;gap:30px">
        ${chip()}
        ${H(h||'Headline da capa',132,'#fff','line-height:.94')}
        <div style="font-size:31px;line-height:1.26;color:#E4E4E4;text-transform:uppercase;
          letter-spacing:.4px">${esc(c||'Subheadline')}</div>
      </div></div>`;

    const bg = f==='destaque'?cli.accent : f==='escuro'?cli.escuro : cli.claro;
    const claroFundo = (f==='claro'||f==='cta');
    const corH = f==='destaque' ? '#000' : claroFundo ? cli.accent : '#fff';
    const corC = f==='destaque' ? '#fff' : claroFundo ? 'rgba(0,0,0,.78)' : 'rgba(255,255,255,.70)';
    const corB = f==='destaque' ? 'rgba(255,255,255,.80)' : claroFundo ? 'rgba(0,0,0,.45)' : 'rgba(255,255,255,.55)';
    const seta = f==='destaque' ? `<div style="position:absolute;right:60px;bottom:60px;width:78px;
      height:78px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;
      justify-content:center;font-size:36px;font-weight:600;z-index:20">→</div>` : '';
    const cta = f==='cta' ? `<div style="border-radius:22px;padding:40px 46px;background:#fff;
      border:3px solid ${cli.accent}">
      <div style="font-size:25px;color:rgba(0,0,0,.55);margin-bottom:10px">Comenta a palavra abaixo:</div>
      <div style="font-family:'Montserrat';font-size:92px;font-weight:800;line-height:1;
        letter-spacing:-.04em;color:${cli.accent}">${esc((h||'PRIME').toUpperCase())}</div></div>` : '';
    return `<div class="slide" style="background:${bg}">${barra(corB)}
      <div style="position:absolute;top:132px;left:60px;right:60px;bottom:92px;display:flex;
        flex-direction:column;justify-content:center;gap:34px;z-index:2">
        ${f!=='cta' ? H(h||'Headline',112,corH) : ''}
        <div style="font-size:41px;line-height:1.17;letter-spacing:-.8px;text-align:justify;
          color:${corC}">${esc(c||'Texto de apoio do slide.')}</div>
        ${cta}
      </div>${seta}</div>`;
  }

  if (T === 'brands1') return `<div class="slide" style="background:#000">
    <div style="position:absolute;inset:0;background:${foto(i)};opacity:.9"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,
      rgba(0,0,0,.42) 0%,rgba(0,0,0,.12) 34%,rgba(0,0,0,.72) 66%,rgba(0,0,0,.96) 100%)"></div>
    ${barra('rgba(255,255,255,.50)')}
    <div style="position:absolute;left:64px;right:64px;bottom:110px;z-index:10">
      <div style="font-size:26px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
        color:${cli.accent};margin-bottom:26px">${esc(cli.handle)}</div>
      ${H(h||'Headline em duas ou três linhas',104,'#fff')}
      <div style="font-size:32px;line-height:1.34;color:rgba(255,255,255,.72);margin-top:26px;
        max-width:86%">${esc(c||'Linha de apoio abaixo da headline.')}</div>
    </div></div>`;

  if (T === 'brands2') return `<div class="slide" style="background:#000">
    <div style="position:absolute;inset:0;background:${foto(i+2)};opacity:.88"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 50%,
      rgba(0,0,0,.30) 0%,rgba(0,0,0,.68) 70%,rgba(0,0,0,.86) 100%)"></div>
    ${barra('rgba(255,255,255,.50)')}
    <div style="position:absolute;inset:150px 92px 130px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;gap:34px;z-index:10">
      <div style="width:64px;height:2px;background:${cli.accent}"></div>
      <div style="font-family:Georgia,'Times New Roman',serif;font-size:106px;font-weight:400;
        line-height:1.06;letter-spacing:-.02em;color:#fff">${esc(h||'A headline em serifa, centralizada')}</div>
      <div style="font-size:30px;line-height:1.4;color:rgba(255,255,255,.74);max-width:80%">
        ${esc(c||'Apoio curto embaixo.')}</div>
    </div></div>`;

  if (T === 'brands3') return `<div class="slide" style="background:${cli.escuro}">
    ${barra('rgba(255,255,255,.50)')}
    <div style="position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr">
      <div style="background:${foto(i+4)}"></div><div style="background:${cli.escuro}"></div></div>
    <div style="position:absolute;left:calc(50% + 52px);right:56px;top:150px;bottom:110px;
      display:flex;flex-direction:column;justify-content:center;gap:30px;z-index:10">
      ${H(h||'Headline na coluna da direita',82,'#fff')}
      <div style="font-size:33px;line-height:1.32;color:rgba(255,255,255,.70)">
        ${esc(c||'Texto de apoio ao lado da imagem.')}</div>
      <div style="width:54px;height:4px;background:${cli.accent}"></div>
    </div></div>`;

  /* twitter */
  return `<div class="slide" style="background:${cli.claro};display:flex;align-items:center;
    justify-content:center;padding:78px">
    <div style="width:100%;background:#fff;border-radius:34px;padding:56px;
      box-shadow:0 20px 60px rgba(0,0,0,.10)">
      <div style="display:flex;align-items:center;gap:20px;margin-bottom:34px">
        <div style="width:82px;height:82px;border-radius:50%;background:${cli.accent};display:flex;
          align-items:center;justify-content:center;font-family:'Montserrat';font-size:38px;
          font-weight:800;color:#fff">${esc(cli.marca[0])}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:9px;font-size:32px;font-weight:600;color:#0F1419">
            ${esc(cli.marca)}
            <span style="width:28px;height:28px;border-radius:50%;background:#1d9bf0;color:#fff;
              display:flex;align-items:center;justify-content:center;font-size:16px">✓</span></div>
          <div style="font-size:28px;color:#536471">${esc(cli.handle)}</div></div>
      </div>
      <div style="font-size:46px;line-height:1.3;color:#0F1419;font-weight:500">${esc(h||'A frase principal do post.')}</div>
      <div style="font-size:38px;line-height:1.42;color:#0F1419;margin-top:24px">${esc(c||'O parágrafo de apoio, logo abaixo.')}</div>
      <div style="height:280px;border-radius:22px;margin-top:34px;background:${foto(i+6)}"></div>
      <div style="display:flex;gap:52px;margin-top:34px;font-size:28px;color:#536471">
        <span>♡ 1.234</span><span>↺ 218</span><span>↗</span></div>
    </div></div>`;
}

/* ============ pintura ============ */
function escala(el, alvo){
  const s = alvo / 1080;
  el.style.transform = `scale(${s})`;
  return { w: Math.round(1080*s), h: Math.round(1350*s) };
}
function pintar(){
  document.documentElement.style.setProperty('--pt-accent', cli.accent);
  const n = nSlides();
  if (atual >= n) atual = n-1;

  const largura = Math.min(370, Math.max(230, window.innerWidth * 0.26));
  const m = $('#moldura');
  m.innerHTML = render(atual);
  const d = escala(m.firstElementChild, largura);
  m.style.width = d.w+'px'; m.style.height = d.h+'px';

  $('#info-tpl').textContent = tpl.nome;
  $('#info-n').textContent = `slide ${atual+1} de ${n}`;

  const t = $('#tiras'); t.innerHTML = '';
  for (let i=0;i<n;i++){
    const b = document.createElement('button');
    b.className='tira'; b.type='button';
    b.setAttribute('aria-pressed', i===atual);
    b.setAttribute('aria-label', `Slide ${i+1}`);
    b.innerHTML = `<span class="tira-n">${String(i+1).padStart(2,'0')}</span>` + render(i);
    b.style.width='68px'; b.style.height='85px';
    b.onclick = () => { atual=i; pintar(); };
    t.appendChild(b);
    const s = b.querySelector('.slide');
    escala(s, 64);
    s.style.pointerEvents='none';
  }
  contar();
}

function contar(){
  const n = nSlides(); const el = $('#contagem'); el.innerHTML='';
  const add = (k,v,cls='') => {
    const d = document.createElement('div'); d.className='linha-c';
    d.innerHTML = `<span>${k}</span><span class="val ${cls}">${v}</span>`; el.appendChild(d);
  };
  const usados = blocos.filter(b=>b && b.trim()).length;
  add('blocos preenchidos', `${usados} / ${n*2}`, usados>=n*2?'bom':'');
  let longas = 0, pior = 0;
  for (let i=1;i<n;i++){ const h=(par(i).h||'').length; if(h>26) longas++; if(h>pior) pior=h; }
  add('headlines acima de 26', longas, longas?'alerta':'bom');
  add('maior headline interna', pior+' car.', pior>26?'alerta':'bom');
}

/* ============ montagem ============ */
function montarAbas(){
  const c = $('#abas');
  CLIENTES.forEach((x,i) => {
    const b = document.createElement('button');
    b.className='aba'; b.type='button'; b.role='tab';
    b.setAttribute('aria-selected', i===0);
    b.innerHTML = `<span class="ponto" style="background:${x.accent}"></span>${x.nome}`;
    b.onclick = () => {
      cli = x;
      [...c.children].forEach(k => k.setAttribute('aria-selected','false'));
      b.setAttribute('aria-selected','true');
      camposMarca(); pintar();
    };
    c.appendChild(b);
  });
}
function camposMarca(){
  const defs = [['escuro','Fundo'],['accent','Destaque'],['claro','Claro']];
  const c = $('#cores'); c.innerHTML='';
  defs.forEach(([k,nome]) => {
    const d = document.createElement('div'); d.className='cor';
    d.innerHTML = `<input type="color" value="${cli[k]}" aria-label="${nome}">
      <div class="cor-txt"><div class="cor-nome">${nome}</div>
      <div class="cor-hex">${cli[k].toUpperCase()}</div></div>`;
    d.querySelector('input').oninput = e => {
      cli[k] = e.target.value;
      d.querySelector('.cor-hex').textContent = e.target.value.toUpperCase();
      pintar();
    };
    c.appendChild(d);
  });
  $('#fontes-info').textContent = `${cli.head} · ${cli.body} — ${cli.nicho}`;
  $('#handle').value = cli.handle; $('#nome').value = cli.marca; $('#direito').value = cli.direito;
}
function montarTpls(){
  const c = $('#tpls'); c.innerHTML='';
  TEMPLATES.forEach(t => {
    const b = document.createElement('button');
    b.className='tpl'; b.type='button';
    b.setAttribute('aria-pressed', t.id===tpl.id);
    b.innerHTML = `<span class="tpl-mini" id="mini-${t.id}"></span>
      <span><span class="tpl-nome">${t.nome}</span><span class="tpl-sub">${t.etapa}</span></span>`;
    b.onclick = () => {
      tpl = t; atual = 0;
      [...c.children].forEach(k => k.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      pintar(); miniaturas();
    };
    c.appendChild(b);
  });
  miniaturas();
}
function miniaturas(){
  const guarda = tpl;
  TEMPLATES.forEach(t => {
    const alvo = document.getElementById('mini-'+t.id); if(!alvo) return;
    tpl = t; alvo.innerHTML = render(0);
    const s = alvo.querySelector('.slide');
    escala(s, 34); s.style.pointerEvents='none';
  });
  tpl = guarda;
}

$('#btn-aplicar').onclick = () => { blocos = parse($('#editor').value); pintar(); };
$('#btn-exemplo').onclick = () => { $('#editor').value = EXEMPLO; blocos = parse(EXEMPLO); pintar(); };
$('#btn-prev').onclick = () => { atual = (atual-1+nSlides())%nSlides(); pintar(); };
$('#btn-next').onclick = () => { atual = (atual+1)%nSlides(); pintar(); };
$('#editor').oninput = () => { blocos = parse($('#editor').value); pintar(); };
['handle','nome','direito'].forEach(k => {
  $('#'+k).oninput = e => {
    cli[{handle:'handle',nome:'marca',direito:'direito'}[k]] = e.target.value; pintar();
  };
});
let t0; window.onresize = () => { clearTimeout(t0); t0 = setTimeout(pintar, 120); };

montarAbas(); camposMarca(); montarTpls();
$('#editor').value = EXEMPLO; blocos = parse(EXEMPLO);
pintar();
</script>
